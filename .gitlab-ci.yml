# PHANTOMS learning repository: Bun-first validation on GitLab.
#
# The source project is private and consumes the internal Launch Sequence
# composition below. The public fallback for a different GitLab instance is
# documented in docs/ci-cd.md; it does not depend on this private include.
#
# MR pipelines deliberately do not start a container builder. The shared
# unprivileged Kubernetes runner pool cannot start rootlesskit, so MRs use a
# static Dockerfile lint. The protected default branch builds with the
# Launch Sequence Kubernetes BuildKit job, signs and verifies the image, then
# smoke-tests the exact digest in an isolated Kubernetes regression job. No
# DinD service runs in the GitLab runner pod.
#
# Launch Sequence is pinned to an immutable commit. Update the pin deliberately
# after reading its changelog and running its consumer linter.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - preflight
  - security
  - build
  - sign
  - attest
  - regression
  - deploy

include:
  - project: 'DroidOpsInc/launch-sequence'
    # Resolved 2026-10-01 from origin/main. Keep this SHA immutable until the
    # replacement has been reviewed and linted against this consumer.
    ref: b5afba2af206d84ee58315122977b11266f0ff1e
    file: '/pipelines/validate-only.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: b5afba2af206d84ee58315122977b11266f0ff1e
    file: '/jobs/build-buildkit.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: b5afba2af206d84ee58315122977b11266f0ff1e
    file: '/jobs/sign.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: b5afba2af206d84ee58315122977b11266f0ff1e
    file: '/jobs/signature-verify.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: b5afba2af206d84ee58315122977b11266f0ff1e
    file: '/jobs/regression-container-image.yml'

variables:
  # The shared template defaults to a private Alpine utility image. This
  # consumer uses Bun as its only JavaScript runtime.
  # The Harbor Docker Hub proxy is used by the internal runners; public users
  # should use oven/bun:1.4.2-slim in the fallback shown in docs/ci-cd.md.
  PREFLIGHT_IMAGE: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  PREFLIGHT_REQUIRED_TOOLS: 'bun'
  PREFLIGHT_COMMANDS: >-
    bun install --frozen-lockfile &&
    bun run lint &&
    bun run typecheck &&
    bun run db:check
  TEST_COMMANDS: >-
    bun install --frozen-lockfile &&
    bun test &&
    bun run build
  IMAGE_NAME: 'phantoms'
  HARBOR_PROJECT: 'apps'
  NEXT_TELEMETRY_DISABLED: '1'

# The shared SAST job defaults to advisory findings. Make source and secret
# findings blocking for this learning repository.
sast:
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/semgrep/semgrep:1.178.0'
    entrypoint: ['']
  variables:
    SAST_STRICT: 'true'
    GITLEAKS_ENABLED: 'false'

secret-scan:
  stage: security
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/zricethezav/gitleaks:v8.30.1'
    entrypoint: ['']
  before_script: []
  script:
    - gitleaks detect --source . --no-banner --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

dependency-audit:
  stage: security
  image: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  script:
    - bun install --frozen-lockfile
    - bun audit --audit-level high
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Exercise the actual PostgreSQL migration and repository against a disposable
# service. The public fallback equivalent is documented in docs/ci-cd.md.
database-integration:
  stage: preflight
  image: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  services:
    - name: '${IMAGE_REGISTRY}/dockerhub-proxy/library/postgres:18.6-alpine'
      alias: postgres
  variables:
    POSTGRES_DB: 'phantoms_test'
    POSTGRES_USER: 'phantoms'
    POSTGRES_PASSWORD: 'ci-only-password'
    DATABASE_URL: 'postgres://phantoms:ci-only-password@postgres:5432/phantoms_test'
    NEXT_TELEMETRY_DISABLED: '1'
  script:
    - bun --version
    - bun install --frozen-lockfile
    - bun run db:migrate
    - bun test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Check the Dockerfile on merge requests without privileged execution or
# registry credentials. A static lint catches syntax and common image mistakes
# while keeping untrusted code on an unprivileged runner. A full
# image build is intentionally deferred to the protected default branch.
dockerfile-lint-mr:
  stage: build
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/hadolint/hadolint:v2.15.1-debian'
    entrypoint: ['']
  before_script: []
  script:
    - hadolint --version
    - hadolint --failure-threshold warning Dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'

# Build in the shared rootless BuildKit Kubernetes dispatcher. It publishes
# only a build-attempt-specific tag to private Harbor and exports its digest.
build:
  extends: .build:buildkit
  variables:
    BUILD_ARGS: 'BUN_IMAGE=harbor.focuscell.org/dockerhub-proxy/oven/bun:1.4.2-slim'
    # A new build attempt gets its own tag, so a manual retry cannot move the
    # image reference already verified by an earlier attempt in this pipeline.
    IMAGE_TAG: '${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_IID}-${CI_JOB_ID}'
    BUILD_SIGN_WITH_NOTATION: 'false'
    # The dedicated sign job owns signing credentials. Optional Kubernetes
    # secretKeyRefs in BuildKit resolve to no credentials for this build pod.
    NOTATION_SECRET: 'phantoms-build-no-signing-secret'
    PUSH_LATEST: 'false'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Sign the immutable digest from BuildKit with the protected Notation key.
sign:
  extends: .sign:notation
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Verify both the signature and SBOM before running the image smoke test.
signature-verify:
  extends: .signature:verify
  variables:
    VERIFY_NAMESPACE: 'ci'
  before_script:
    # Resolve the exact tag exported by this build attempt.
    - export IMAGE_TAG="$BUILT_IMAGE_TAG"
  needs:
    - job: build
      artifacts: true
    - job: sign
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  after_script:
    - |
      VERIFY_K8S_JOB_NAME="verify-sig-${IMAGE_NAME}-${CI_COMMIT_SHORT_SHA}-p${CI_PIPELINE_IID}-j${CI_JOB_ID}"
      printf 'VERIFY_K8S_JOB_NAME=%s\n' "$VERIFY_K8S_JOB_NAME" > signature-verify.env
      printf 'EXPECTED_IMAGE_DIGEST=%s\n' "${BUILT_IMAGE_DIGEST:-}" >> signature-verify.env
      kubectl logs -n "${VERIFY_NAMESPACE:-ci}" "job/${VERIFY_K8S_JOB_NAME}" --all-containers --tail=-1 2>&1 \
        | grep -E 'Resolved digest:|Notation signature VERIFIED|SBOM attestation VERIFIED|WARNING: No CycloneDX|Verification Summary|Signature:|SBOM:' \
        > signature-verify.log || true
  artifacts:
    when: always
    paths:
      - signature-verify.log
    reports:
      dotenv: signature-verify.env

# Launch Sequence's verifier reports a missing CycloneDX SBOM as a warning.
# Make the assurance blocking here and require that its build-tag lookup
# resolved to the exact digest exported by BuildKit before smoke can start.
attestation-gate:
  stage: regression
  image:
    name: 'harbor.focuscell.org/dockerhub-proxy/alpine/k8s:1.31.13'
  needs:
    - job: build
      artifacts: true
    - job: signature-verify
      artifacts: true
  script:
    - |
      set -eu
      test -s signature-verify.log
      test -n "${BUILT_IMAGE_DIGEST:-}"
      test "${EXPECTED_IMAGE_DIGEST:-}" = "$BUILT_IMAGE_DIGEST"
      grep -F "Resolved digest: $BUILT_IMAGE_DIGEST" signature-verify.log
      grep -F 'Notation signature VERIFIED on' signature-verify.log | grep -F "@$BUILT_IMAGE_DIGEST"
      grep -F 'SBOM attestation VERIFIED' signature-verify.log
      echo 'Signature and CycloneDX SBOM verified for the BuildKit digest.'
      {
        printf 'BUILT_IMAGE=%s\n' "$BUILT_IMAGE"
        printf 'BUILT_IMAGE_REF=%s\n' "$BUILT_IMAGE_REF"
        printf 'BUILT_IMAGE_DIGEST=%s\n' "$BUILT_IMAGE_DIGEST"
        printf 'BUILT_IMAGE_REPOSITORY=%s\n' "$BUILT_IMAGE_REPOSITORY"
        printf 'BUILT_IMAGE_TAG=%s\n' "$BUILT_IMAGE_TAG"
      } > verified-image.env
  artifacts:
    reports:
      dotenv: verified-image.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Run the app inside the exact built image and check its page, health route,
# and unauthenticated API boundary after signature and SBOM verification.
container-build-smoke:
  extends: .regression:container-image
  needs:
    - job: attestation-gate
      artifacts: true
  variables:
    REGRESSION_KIND: smoke
    REGRESSION_TIMEOUT: '300'
    SMOKE_COMMANDS: 'rm -rf /workspace/.git && bun scripts/container-smoke.ts'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
