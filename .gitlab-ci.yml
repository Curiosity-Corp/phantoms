# PHANTOMS learning repository: Bun-first validation on GitLab.
#
# The source project is private and consumes the internal Launch Sequence
# composition below. The public fallback for a different GitLab instance is
# documented in docs/ci-cd.md; it does not depend on this private include.
#
# MR pipelines deliberately do not start a container builder. The shared
# unprivileged Kubernetes runner pool cannot start rootlesskit, so MRs use a
# static Dockerfile lint. The protected default branch builds with the
# Launch Sequence Kubernetes BuildKit job, signs and verifies the image, then
# smoke-tests the exact digest in an isolated Kubernetes regression job. No
# DinD service runs in the GitLab runner pod.
#
# Launch Sequence is included at ref: main. Pinning to an old commit leaves
# jobs without the ci-dispatch runner tag and they lose their Kubernetes API
# access, so this consumer tracks upstream. DOCKERHUB_PROXY (a project CI
# variable) names the Docker Hub pull-through cache the runners use.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - preflight
  - security
  - build
  - sign
  - attest
  - regression
  - deploy

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/pipelines/validate-only.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/build-buildkit.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/sign.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/attest.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/signature-verify.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/regression-container-image.yml'

variables:
  # The shared template defaults to a private Alpine utility image. This
  # consumer uses Bun as its only JavaScript runtime.
  # The Harbor Docker Hub proxy is used by the internal runners; public users
  # should use oven/bun:1.4.2-slim in the fallback shown in docs/ci-cd.md.
  PREFLIGHT_IMAGE: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  PREFLIGHT_REQUIRED_TOOLS: 'bun'
  PREFLIGHT_COMMANDS: >-
    bun install --frozen-lockfile &&
    bun run lint &&
    bun run typecheck &&
    bun run db:check
  TEST_COMMANDS: >-
    bun install --frozen-lockfile &&
    bun test &&
    bun run build
  IMAGE_NAME: 'phantoms'
  HARBOR_PROJECT: 'apps'
  NEXT_TELEMETRY_DISABLED: '1'

# The shared SAST job defaults to advisory findings. Make source and secret
# findings blocking for this learning repository.
sast:
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/semgrep/semgrep:1.178.0'
    entrypoint: ['']
  variables:
    SAST_STRICT: 'true'
    GITLEAKS_ENABLED: 'false'

secret-scan:
  stage: security
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/zricethezav/gitleaks:v8.30.1'
    entrypoint: ['']
  before_script: []
  script:
    - gitleaks detect --source . --no-banner --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

dependency-audit:
  stage: security
  image: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  script:
    - bun install --frozen-lockfile
    - bun audit --audit-level high
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Exercise the actual PostgreSQL migration and repository against a disposable
# service. The public fallback equivalent is documented in docs/ci-cd.md.
database-integration:
  stage: preflight
  image: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  services:
    - name: '${IMAGE_REGISTRY}/dockerhub-proxy/library/postgres:18.6-alpine'
      alias: postgres
  variables:
    POSTGRES_DB: 'phantoms_test'
    POSTGRES_USER: 'phantoms'
    POSTGRES_PASSWORD: 'ci-only-password'
    DATABASE_URL: 'postgres://phantoms:ci-only-password@postgres:5432/phantoms_test'
    NEXT_TELEMETRY_DISABLED: '1'
  script:
    - bun --version
    - bun install --frozen-lockfile
    # The postgres service starts concurrently with this job; wait until it
    # accepts TCP connections (the image only opens TCP after its init
    # restart) instead of racing drizzle-kit against it.
    - |
      ready=0
      for i in $(seq 1 30); do
        if bun -e 'const s = await Bun.connect({ hostname: "postgres", port: 5432, socket: { data() {}, open(c) { c.end(); } } }); process.exit(0)' 2>/dev/null; then ready=1; break; fi
        echo "waiting for postgres ($i/30)"; sleep 2
      done
      test "$ready" = 1
    - bun run db:migrate
    - bun test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Optional retrieval stack: pgvector, then Milvus 3 with etcd and SeaweedFS (the
# `pgvector`, `retrieval` and `objects` Compose profiles). It runs on pipeline
# schedules and can be started by hand on a merge request; it never runs on
# ordinary pushes, so the default path stays light and needs none of these
# images. Create the schedule in the project's CI/CD settings. The image
# versions repeat compose.yaml; change them together (docs/retrieval.md).
retrieval-integration:
  stage: preflight
  image: '${IMAGE_REGISTRY}/dockerhub-proxy/oven/bun:1.4.2-slim'
  services:
    - name: '${IMAGE_REGISTRY}/dockerhub-proxy/pgvector/pgvector:0.8.6-pg18'
      alias: pgvector
      variables:
        POSTGRES_DB: 'phantoms_test'
        POSTGRES_USER: 'phantoms'
        POSTGRES_PASSWORD: 'ci-only-password'
    - name: '${IMAGE_REGISTRY}/dockerhub-proxy/chrislusf/seaweedfs:4.48'
      alias: seaweedfs
      command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-master.volumeSizeLimitMB=512']
      variables:
        AWS_ACCESS_KEY_ID: 'ci-only-access'
        AWS_SECRET_ACCESS_KEY: 'ci-only-secret'
    - name: 'quay.io/coreos/etcd:v3.5.34'
      alias: etcd
      # Configured by environment so the image's own start command is used.
      variables:
        ETCD_ADVERTISE_CLIENT_URLS: 'http://etcd:2379'
        ETCD_LISTEN_CLIENT_URLS: 'http://0.0.0.0:2379'
        ETCD_DATA_DIR: '/var/lib/etcd/data'
    - name: '${IMAGE_REGISTRY}/dockerhub-proxy/milvusdb/milvus:v3.0.3'
      alias: milvus
      # Services start together. Wait for etcd and SeaweedFS first, because a
      # sidecar that exits is not restarted.
      command:
        - sh
        - -c
        - >-
          until curl -fsS http://etcd:2379/health >/dev/null
          && curl -fsS http://seaweedfs:9333/cluster/status >/dev/null;
          do sleep 2; done;
          exec milvus run standalone
      variables:
        ETCD_ENDPOINTS: 'etcd:2379'
        MINIO_ADDRESS: 'seaweedfs:8333'
        MINIO_PORT: '8333'
        MINIO_ACCESS_KEY_ID: 'ci-only-access'
        MINIO_SECRET_ACCESS_KEY: 'ci-only-secret'
        MINIO_USESSL: 'false'
        MINIO_BUCKETNAME: 'milvus'
  variables:
    NEXT_TELEMETRY_DISABLED: '1'
    RETRIEVAL_INTEGRATION: '1'
    PGVECTOR_DATABASE_URL: 'postgres://phantoms:ci-only-password@pgvector:5432/phantoms_test'
    S3_ENDPOINT: 'http://seaweedfs:8333'
    S3_ACCESS_KEY: 'ci-only-access'
    S3_SECRET_KEY: 'ci-only-secret'
    MILVUS_URL: 'http://milvus:19530'
    MILVUS_BUCKET: 'milvus'
  timeout: 20m
  script:
    - bun --version
    - bun install --frozen-lockfile
    # The services start concurrently with this job and Milvus needs etcd and
    # SeaweedFS first (it retries on its own), so wait for each one to answer
    # before testing. A service that never comes up fails the job.
    - |
      bun -e '
        const checks = {
          pgvector: () => Bun.connect({ hostname: "pgvector", port: 5432, socket: { data() {}, open(c) { c.end(); } } }),
          seaweedfs: () => fetch("http://seaweedfs:9333/cluster/status").then((r) => { if (!r.ok) throw new Error(String(r.status)); }),
          milvus: () => fetch("http://milvus:9091/healthz").then((r) => { if (!r.ok) throw new Error(String(r.status)); }),
        };
        for (const [name, check] of Object.entries(checks)) {
          let ok = false;
          for (let i = 1; i <= 60 && !ok; i++) {
            try { await check(); ok = true; } catch { if (i % 5 === 0) console.log(`waiting for ${name} (${i}/60)`); await Bun.sleep(4000); }
          }
          if (!ok) {
            console.error(`${name} did not become ready`);
            for (const url of ["http://127.0.0.1:2379/health", "http://etcd:2379/health","http://seaweedfs:9333/cluster/status", "http://milvus:9091/healthz"]) {
              const r = await fetch(url).then((x) => x.text().then((t) => `${x.status} ${t.slice(0, 200)}`), (e) => `unreachable: ${e.message}`);
              console.error(`diagnostic ${url}: ${r}`);
            }
            process.exit(1);
          }
          console.log(`${name} ready`);
        }
      '
    - bun run db:migrate:vector
    - bun test packages/db apps/api/test/retrieval.integration.test.ts
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

# Check the Dockerfile on merge requests without privileged execution or
# registry credentials. A static lint catches syntax and common image mistakes
# while keeping untrusted code on an unprivileged runner. A full
# image build is intentionally deferred to the protected default branch.
dockerfile-lint-mr:
  stage: build
  image:
    name: '${IMAGE_REGISTRY}/dockerhub-proxy/hadolint/hadolint:v2.15.1-debian'
    entrypoint: ['']
  before_script: []
  script:
    - hadolint --version
    - hadolint --failure-threshold warning Dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'

# Build in the shared rootless BuildKit Kubernetes dispatcher. It publishes
# only a build-attempt-specific tag to private Harbor and exports its digest.
build:
  extends: .build:buildkit
  variables:
    BUILD_ARGS: 'BUN_IMAGE=${DOCKERHUB_PROXY}/oven/bun:1.4.2-slim'
    # A new build attempt gets its own tag, so a manual retry cannot move the
    # image reference already verified by an earlier attempt in this pipeline.
    IMAGE_TAG: '${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_IID}-${CI_JOB_ID}'
    BUILD_SIGN_WITH_NOTATION: 'false'
    # The dedicated sign job owns signing credentials. Optional Kubernetes
    # secretKeyRefs in BuildKit resolve to no credentials for this build pod.
    NOTATION_SECRET: 'phantoms-build-no-signing-secret'
    PUSH_LATEST: 'false'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Sign the immutable digest from BuildKit with the protected Notation key.
sign:
  extends: .sign:notation
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Attach the CycloneDX SBOM to the exact digest BuildKit exported. The in-build
# SBOM is best-effort; this job is the authoritative gate that makes
# signature-verify (and attestation-gate) find 'SBOM attestation VERIFIED'.
attest:
  extends: .attest:sbom
  before_script:
    # Resolve the exact tag exported by this build attempt.
    - export IMAGE_TAG="$BUILT_IMAGE_TAG"
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Verify both the signature and SBOM before running the image smoke test.
signature-verify:
  extends: .signature:verify
  variables:
    VERIFY_NAMESPACE: 'ci'
  before_script:
    # Resolve the exact tag exported by this build attempt.
    - export IMAGE_TAG="$BUILT_IMAGE_TAG"
  needs:
    - job: build
      artifacts: true
    - job: sign
      artifacts: false
    - job: attest
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  after_script:
    - |
      VERIFY_K8S_JOB_NAME="verify-sig-${IMAGE_NAME}-${CI_COMMIT_SHORT_SHA}-p${CI_PIPELINE_IID}-j${CI_JOB_ID}"
      printf 'VERIFY_K8S_JOB_NAME=%s\n' "$VERIFY_K8S_JOB_NAME" > signature-verify.env
      printf 'EXPECTED_IMAGE_DIGEST=%s\n' "${BUILT_IMAGE_DIGEST:-}" >> signature-verify.env
      kubectl logs -n "${VERIFY_NAMESPACE:-ci}" "job/${VERIFY_K8S_JOB_NAME}" --all-containers --tail=-1 2>&1 \
        | grep -E 'Resolved digest:|Notation signature VERIFIED|SBOM attestation VERIFIED|WARNING: No CycloneDX|Verification Summary|Signature:|SBOM:' \
        > signature-verify.log || true
  artifacts:
    when: always
    paths:
      - signature-verify.log
    reports:
      dotenv: signature-verify.env

# Launch Sequence's verifier reports a missing CycloneDX SBOM as a warning.
# Make the assurance blocking here and require that its build-tag lookup
# resolved to the exact digest exported by BuildKit before smoke can start.
attestation-gate:
  stage: regression
  image:
    name: '${DOCKERHUB_PROXY}/alpine/k8s:1.31.13'
  needs:
    - job: build
      artifacts: true
    - job: signature-verify
      artifacts: true
  script:
    - |
      set -eu
      test -s signature-verify.log
      test -n "${BUILT_IMAGE_DIGEST:-}"
      test "${EXPECTED_IMAGE_DIGEST:-}" = "$BUILT_IMAGE_DIGEST"
      grep -F "Resolved digest: $BUILT_IMAGE_DIGEST" signature-verify.log
      grep -F 'Notation signature VERIFIED on' signature-verify.log | grep -F "@$BUILT_IMAGE_DIGEST"
      grep -F 'SBOM attestation VERIFIED' signature-verify.log
      echo 'Signature and CycloneDX SBOM verified for the BuildKit digest.'
      {
        printf 'BUILT_IMAGE=%s\n' "$BUILT_IMAGE"
        printf 'BUILT_IMAGE_REF=%s\n' "$BUILT_IMAGE_REF"
        printf 'BUILT_IMAGE_DIGEST=%s\n' "$BUILT_IMAGE_DIGEST"
        printf 'BUILT_IMAGE_REPOSITORY=%s\n' "$BUILT_IMAGE_REPOSITORY"
        printf 'BUILT_IMAGE_TAG=%s\n' "$BUILT_IMAGE_TAG"
      } > verified-image.env
  artifacts:
    reports:
      dotenv: verified-image.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Run the app inside the exact built image and check its page, health route,
# and unauthenticated API boundary after signature and SBOM verification.
container-build-smoke:
  extends: .regression:container-image
  needs:
    - job: attestation-gate
      artifacts: true
  variables:
    REGRESSION_KIND: smoke
    REGRESSION_TIMEOUT: '300'
    SMOKE_COMMANDS: 'rm -rf /workspace/.git && bun scripts/container-smoke.ts'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
