services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phantoms}
      POSTGRES_USER: ${POSTGRES_USER:-phantoms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Optional services. Nothing below starts with a plain `docker compose up`;
  # each service sits behind a profile. See docs/retrieval.md.
  #
  #   pgvector   PostgreSQL with the pgvector extension (the first retrieval step)
  #   objects    SeaweedFS S3 API only
  #   retrieval  Milvus standalone plus the etcd and SeaweedFS it needs
  #
  # Every published port is bound to loopback. Credentials are disposable
  # local defaults; override them in .env and never reuse them elsewhere.

  postgres-pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phantoms}
      POSTGRES_USER: ${POSTGRES_USER:-phantoms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - postgres-pgvector-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  seaweedfs:
    profiles: ["objects", "retrieval"]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -master.volumeSizeLimitMB=512
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-phantoms-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-phantoms-local-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  etcd:
    profiles: ["retrieval"]
    image: quay.io/coreos/etcd:v3.5.34
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  milvus:
    profiles: ["retrieval"]
    image: milvusdb/milvus:v3.0.3
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: seaweedfs:8333
      MINIO_PORT: "8333"
      MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-phantoms-local}
      MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-phantoms-local-secret}
      MINIO_USESSL: "false"
      MINIO_BUCKETNAME: ${MILVUS_BUCKET:-milvus}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  postgres-data:
  # The optional volumes have stable names so the backup commands in
  # docs/retrieval.md can address them. Set COMPOSE_PROJECT_NAME to keep two
  # checkouts apart.
  postgres-pgvector-data:
    name: ${COMPOSE_PROJECT_NAME:-phantoms}-pgvector-data
  seaweedfs-data:
    name: ${COMPOSE_PROJECT_NAME:-phantoms}-seaweedfs-data
  etcd-data:
    name: ${COMPOSE_PROJECT_NAME:-phantoms}-etcd-data
  milvus-data:
    name: ${COMPOSE_PROJECT_NAME:-phantoms}-milvus-data
